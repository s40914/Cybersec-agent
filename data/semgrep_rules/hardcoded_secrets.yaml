rules:
  - id: hardcoded-password-assignment
    languages: [generic]
    severity: WARNING
    message: >-
      Wykryto zahardkodowane haslo/sekret bezposrednio w kodzie zrodlowym
      (zmienna o nazwie sugerujacej haslo/sekret/klucz API przypisana do
      literalu stringowego). Sekrety nie powinny byc trzymane w kodzie -
      uzyj zmiennych srodowiskowych lub dedykowanego menedzera sekretow
      (np. Vault, AWS Secrets Manager).
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
    patterns:
      - pattern-regex: '(?i)\b(password|passwd|pwd|secret|api[_-]?key|access[_-]?token|auth[_-]?token)\b\s*[:=]\s*["\x27][^"\x27]{4,}["\x27]'
